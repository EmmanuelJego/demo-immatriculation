services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: immatriculation
      POSTGRES_PASSWORD: immatriculation
      POSTGRES_DB: immatriculation
    ports:
      - '5442:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U immatriculation -d immatriculation']
      interval: 2s
      timeout: 3s
      retries: 15

  # Ephemeral database for API integration tests: in-memory storage and
  # durability disabled, since its data is wiped before every test anyway.
  db-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: immatriculation
      POSTGRES_PASSWORD: immatriculation
      POSTGRES_DB: immatriculation_test
    ports:
      - '5443:5432'
    tmpfs:
      - /var/lib/postgresql
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U immatriculation -d immatriculation_test']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
